{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Smart-Mail{% endblock %}</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --text-dim: #9aa1b1;
    --accent: #5b8cff;
    --accent-dim: #2d3f6e;
    --danger: #ef5a5a;
    --danger-bg: #3a2020;
    --warn: #e2a33d;
    --ok: #46c98d;
    --radius: 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }

  header.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.2px;
  }

  .brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  nav.topnav {
    display: flex;
    gap: 18px;
    font-size: 14px;
    color: var(--text-dim);
  }

  nav.topnav a:hover { color: var(--text); }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .stat-card .value {
    font-size: 26px;
    font-weight: 700;
  }

  .stat-card .label {
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 4px;
  }

  .stat-card.alert .value { color: var(--danger); }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 16px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
  }

  .chip.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--text);
  }

  select.filter-select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
  }

  .email-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .email-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }

  .email-row:hover {
    border-color: var(--accent);
  }

  .email-row .meta {
    min-width: 0;
  }

  .email-row .subject {
    font-weight: 600;
    font-size: 14.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .email-row .sub-meta {
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid transparent;
  }

  .badge-intent { background: #1c2333; color: #9db4ff; border-color: #2d3f6e; }
  .badge-priority { background: var(--danger-bg); color: var(--danger); border-color: #5a2a2a; }
  .badge-muted { background: #23262e; color: var(--text-dim); }
  .badge-ok { background: #17301f; color: var(--ok); border-color: #1f4a2f; }
  .badge-pending { background: #332a12; color: var(--warn); border-color: #4a3a1a; }

  .sentiment-bar {
    width: 70px;
    height: 6px;
    border-radius: 4px;
    background: #2a2f3a;
    position: relative;
    overflow: hidden;
  }

  .sentiment-bar .fill {
    position: absolute;
    top: 0; bottom: 0;
    border-radius: 4px;
  }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  /* --- Detail page --- */
  .back-link {
    display: inline-block;
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .back-link:hover { color: var(--text); }

  .detail-header {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 18px;
  }

  .detail-header h1 {
    font-size: 20px;
    margin: 0 0 8px 0;
  }

  .detail-header .from {
    color: var(--text-dim);
    font-size: 13.5px;
  }

  .badge-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  .panel h2 {
    font-size: 13.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 12px 0;
  }

  .body-text {
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 14px;
  }

  .action-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .action-item:last-child { border-bottom: none; }

  .action-item input[type="checkbox"] {
    margin-top: 3px;
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .action-item.completed .task-text {
    text-decoration: line-through;
    color: var(--text-dim);
  }

  .action-item .deadline {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  textarea.reply-editor {
    width: 100%;
    min-height: 220px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.5;
    resize: vertical;
  }

  .reply-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    align-items: center;
  }

  button.btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  button.btn:hover { filter: brightness(1.1); }
  button.btn.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .save-status {
    font-size: 12.5px;
    color: var(--text-dim);
  }

  details.pii-panel summary {
    cursor: pointer;
    color: var(--text-dim);
    font-size: 13px;
  }

  .pii-map {
    margin-top: 10px;
    font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .pii-map .row {
    display: flex;
    gap: 10px;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .pii-map .token { color: var(--accent); }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span> Smart-Mail</div>
  <nav class="topnav">
    <a href="{% url 'dashboard' %}">Inbox</a>
    {% if user.is_authenticated %}
      <a href="/admin/">Admin</a>
      <a href="/admin/logout/">Log out ({{ user.username }})</a>
    {% endif %}
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>

<script>
  // Shared JS helpers available to every page.
  function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? decodeURIComponent(match[2]) : null;
  }

  const CSRF_TOKEN = getCookie('csrftoken');

  function renderSentimentBars() {
    document.querySelectorAll('.sentiment-bar[data-score]').forEach((bar) => {
      const score = parseFloat(bar.dataset.score || '0');
      const fill = bar.querySelector('.fill');
      const half = bar.offsetWidth / 2;
      const width = Math.min(Math.abs(score), 1) * half;
      const color = score > 0.15 ? 'var(--ok)' : score < -0.15 ? 'var(--danger)' : 'var(--text-dim)';
      fill.style.background = color;
      fill.style.width = width + 'px';
      if (score >= 0) {
        fill.style.left = half + 'px';
      } else {
        fill.style.left = (half - width) + 'px';
      }
    });
  }

  document.addEventListener('DOMContentLoaded', renderSentimentBars);

  async function apiPost(url, body) {
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': CSRF_TOKEN,
      },
      body: JSON.stringify(body || {}),
    });
    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error || `Request failed (${response.status})`);
    }
    return response.json();
  }
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
